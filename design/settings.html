<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>语音书 · 设置</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"></div>
      <div><div class="name">语音书</div><div class="sub">Speech-Book Studio</div></div>
    </div>
    <div class="nav-group">创作</div>
    <div class="nav-item" data-nav onclick="location.href='dashboard.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>工作台</div>
    <div class="nav-item" data-nav onclick="location.href='studio.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg>工作室</div>
    <div class="nav-group">资源</div>
    <div class="nav-item" data-nav onclick="location.href='voice-library.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3l3-8 4 16 3-8h5"/></svg>音色库</div>
    <div class="nav-item" data-nav><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>任务中心</div>
    <div class="nav-group">账户</div>
    <div class="nav-item active" data-nav><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>设置</div>
    <div style="margin-top:auto" class="card row gap-3">
      <div class="avatar" style="width:34px;height:34px;background:var(--grad)">D</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600">Demo 用户</div><div class="tiny muted">demo@speechbook.cn</div></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar"><h3>设置</h3></header>
    <div class="content">
      <div class="page-head">
        <div><h1>账户与偏好</h1><div class="desc">个人信息、默认偏好与安全设置。</div></div>
      </div>

      <div class="grid cols-2">
      <div class="panel mb">
        <div class="card-h"><h3>基本信息</h3></div>
        <div class="row gap-4 mb">
          <div class="avatar" style="width:64px;height:64px;border-radius:16px;background:var(--grad);font-size:22px">D</div>
          <div class="col gap-2"><button class="btn btn-sm" data-toast="已选择新头像">更换头像</button><span class="tiny muted">支持 PNG / JPG，≤ 2MB</span></div>
        </div>
        <div class="grid cols-2">
          <div class="field"><label class="label">昵称</label><input class="input" value="Demo 用户" /></div>
          <div class="field"><label class="label">邮箱</label><input class="input" value="demo@speechbook.cn" disabled /></div>
        </div>
        <button class="btn btn-primary" data-toast="资料已保存">保存修改</button>
      </div>

      <div class="panel mb">
        <div class="card-h"><h3>创作偏好</h3><span class="sub">新建作品时的默认值</span></div>
        <div class="grid cols-2">
          <div class="field"><label class="label">默认旁白音色</label><select class="select"><option>旁白 · 中性</option><option>男声 · 青年</option><option>女声 · 青年</option></select></div>
          <div class="field"><label class="label">默认合成范围</label><select class="select"><option>样章先行（前 2 章）</option><option>全本合成</option></select></div>
          <div class="field"><label class="label">情绪识别方式</label><select class="select"><option>标点启发式（POC）</option><option>LLM 增强（生产）</option></select></div>
          <div class="field"><label class="label">音频格式</label><select class="select"><option>WAV（无损）</option><option>MP3 128k</option></select></div>
        </div>
        <label class="row gap-2 sm" style="cursor:pointer"><input type="checkbox" checked /> 样章合成完成后自动试听</label>
        <div class="mt"><button class="btn btn-primary" data-toast="偏好已保存">保存偏好</button></div>
      </div>

      <div class="panel mb">
        <div class="card-h"><h3>安全</h3></div>
        <div class="grid cols-2">
          <div class="field"><label class="label">当前密码</label><input class="input" type="password" placeholder="••••••••" /></div>
          <div class="field"><label class="label">新密码</label><input class="input" type="password" placeholder="至少 8 位，含字母与数字" /></div>
        </div>
        <button class="btn" data-toast="密码已更新">修改密码</button>
        <hr class="divider" />
        <div class="row between">
          <div><b class="sm">退出登录</b><p class="tiny muted">清除本机会话凭证</p></div>
          <button class="btn btn-danger" data-toast="已退出登录" data-toast-type="err" onclick="setTimeout(function(){location.href='login.html'},600)">退出</button>
        </div>
      </div>

      <div class="panel">
        <div class="card-h"><h3>关于</h3></div>
        <div class="row between sm"><span class="muted">版本</span><span class="mono tiny">v0.1.0-poc</span></div>
        <div class="row between sm mt-2"><span class="muted">TTS 引擎</span><span class="badge warn"><span class="dot"></span>Stub（POC 占位）</span></div>
        <div class="row between sm mt-2"><span class="muted">相关文档</span><a class="tiny" href="design-system.html">设计系统</a></div>
      </div>
      </div><!-- /grid cols-2 -->
    </div>
  </main>
</div>
<script src="assets/app.js"></script>
</body>
</html>
