# ============================================================
# nginx 反向代理：静态页面 + 把 /api、/files 转给后端容器
# 由 web/Dockerfile 拷进 /etc/nginx/conf.d/default.conf
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传整本剧本（txt/epub）动辄几十 MB，默认的 1m 会直接 413
    client_max_body_size 100m;

    # ---------- 静态资源 ----------
    location / {
        try_files $uri $uri/ /index.html;   # SPA 路由回退，刷新子页不 404
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 解析 / 合成长任务可能跑几分钟，别让默认 60s 把连接掐了
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # SSE 进度推送必须关掉缓冲，否则事件会被攒着一起发
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
    }

    # ---------- 音频 / 样本文件（POC 用本地存储替 MinIO）----------
    location /files/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
