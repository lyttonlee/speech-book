# ============================================================
# POC 轻量覆盖层（可选）
#
# 用途：只想跑「backend + web」两个容器、不占本机 5432/6379/9000 端口时，
#   docker compose -f docker-compose.yml -f docker-compose.poc.yml up -d
#
# scale: 0 把三个中间件容器缩到 0 副本（compose 覆盖写法，保留服务定义但不启动），
# 因此不用改、也不用动 docker-compose.yml 就能两形态切换。
# ============================================================

services:
  db:
    scale: 0        # PostgreSQL 不启动
  redis:
    scale: 0        # Redis 不启动
  minio:
    scale: 0        # MinIO 不启动

  backend:
    environment:
      # 主库改成本地文件数据库，零依赖
      SB_DATABASE_URL: sqlite+aiosqlite:////app/data/speech_book.db
      # 存储改本地目录，音频经 /files/ 由后端反代
      SB_STORAGE_BACKEND: local
      SB_STORAGE_DIR: /app/data
      # 进度改进程内 Hub，不跨副本广播
      SB_PROGRESS_BACKEND: memory
      SB_TASK_QUEUE_BACKEND: memory
      SB_DEBUG: "true"
      SB_CORS_ORIGINS: '["*"]'

  web:
    ports:
      - "8080:80"    # 避开本机 80 端口被其他服务占用
